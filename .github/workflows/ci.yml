name: ci
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python files (syntax check only)
        run: python -m py_compile bot.py an.py ar.py gh.py imgx.py ingest.py lib.py tools_seed.py
